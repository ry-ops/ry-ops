<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 180" width="430" height="180" role="img" aria-labelledby="t d">
  <title id="t">k3s-mcp-server</title>
  <desc id="d">kubectl for Claude: run K3s cluster operations through MCP, from pods and deployments to nodes and logs.</desc>
  <style>
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .spin{transform-origin:0 0;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.pod{animation:pod 3s ease-in-out infinite}@keyframes pod{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
  </style>
  <rect x="1" y="1" width="428" height="178" rx="14" fill="#0d1117" stroke="#30363d"/>
