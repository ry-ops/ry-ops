  <text x="26" y="82" class="sans" font-size="13.5" fill="#8b949e">kubectl for Claude: run K3s cluster</text>
  <text x="26" y="102" class="sans" font-size="13.5" fill="#8b949e">operations through MCP, from pods</text>
  <text x="26" y="122" class="sans" font-size="13.5" fill="#8b949e">and deployments to nodes and logs.</text>
  <circle cx="31" cy="156" r="5" fill="#3572A5"/>
  <text x="42" y="160" font-size="12.5"><tspan class="sans" fill="#c9d1d9">Python</tspan><tspan class="mono" dx="12" font-size="11.5" fill="#e3b341">MCP · Kubernetes</tspan></text>
  
  <g transform="translate(356 92)">
    <path class="spin" d="M0-50L43-25V25L0 50-43 25V-25Z" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="8 6"/>
    <circle r="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#e3b341">k3s</text>
    <circle class="pod" cx="0.0" cy="-32.0" r="6" fill="#e3b341" style="animation-delay:0.0s"/>
