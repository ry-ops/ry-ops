    .wave{opacity:.15;animation:wave 2.4s ease-in-out infinite}.w2{animation-delay:.3s}.w3{animation-delay:.6s}@keyframes wave{0%,100%{opacity:.15}40%{opacity:1}}.pulse{animation:wave 2.4s ease-in-out infinite}
