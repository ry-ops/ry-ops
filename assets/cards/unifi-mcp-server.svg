  <text x="26" y="102" class="sans" font-size="13.5" fill="#8b949e">for Claude: devices, clients, firewall,</text>
  <text x="26" y="122" class="sans" font-size="13.5" fill="#8b949e">WLANs and agent-to-agent (A2A).</text>
