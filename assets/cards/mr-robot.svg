    .hat{opacity:.35;animation:hat 4.5s infinite}.h2{animation-delay:1.5s}.h3{animation-delay:3s}@keyframes hat{0%,33%{opacity:1}34%,100%{opacity:.35}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
