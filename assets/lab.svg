<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t d">
  <title id="t">m5stack-lab</title>
  <desc id="d">An M5Stack Cardputer whose screen is mirrored live into a web browser over WiFi: ESP32 firmware and tools from the m5stack-lab organization.</desc>
  <style>
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .bar{fill:#3fb950;transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite}
    .b1{animation-delay:-.3s;fill:#2dd4bf}.b2{animation-delay:-.7s;fill:#58a6ff}.b3{animation-delay:-1.1s;fill:#2dd4bf}.b4{animation-delay:-1.4s}
    @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
    .flow{fill:none;stroke:#2dd4bf;stroke-width:2;stroke-dasharray:4 10;stroke-linecap:round;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .wave{fill:none;stroke:#2dd4bf;stroke-width:3;stroke-linecap:round;opacity:.2;animation:wave 2s ease-in-out infinite}
    .wv2{animation-delay:.25s}.wv3{animation-delay:.5s}
    @keyframes wave{0%,100%{opacity:.2}40%{opacity:1}}
    .rec{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
  </style>
  <rect x="1" y="1" width="898" height="318" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="52" class="sans" font-size="26" font-weight="700" fill="#e6edf3">m5stack-lab</text>
  <text x="860" y="52" text-anchor="end" class="mono" font-size="13" fill="#8b949e">ESP32 firmware &amp; tools for M5Stack gear</text>

  <!-- Cardputer -->
